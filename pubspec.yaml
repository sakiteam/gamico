# Basics
name: gamico
description: a wrapper for games

# Version
version: 0.0.1

# Home page
homepage:

# Environment
environment:
  sdk: ">=3.3.0 <4.0.0"

# Release dependencies
dependencies:
  # Flutter
  flutter:
    sdk: flutter

  # Localizations
  flutter_localizations:
    sdk: flutter

  # Bloc
  bloc: ^8.1.3
  flutter_bloc: ^8.1.4

  # Firebase
  firebase_auth: ^4.17.5
  firebase_core: ^2.25.4
  firebase_database: ^10.4.6
  firebase_messaging: ^14.7.16
  firebase_analytics: ^10.8.6
  firebase_crashlytics: ^3.4.15
  firebase_performance: ^0.9.3+14
  firebase_game_services: ^2.2.0

  # Flame
  flame: ^1.16.0
  flame_texturepacker: ^3.1.0

  # Utilities
  http: ^1.2.1
  confetti: ^0.7.0
  share_plus: ^7.2.2
  basic_utils: ^5.7.0
  flutter_svg: ^2.0.10+1
  just_audio: ^0.9.36
  draw_on_path: ^0.0.2
  defer_pointer: ^0.0.2
  url_launcher: ^6.2.5
  wakelock_plus: ^1.1.6
  auto_size_text: ^3.0.0
  store_redirect: ^2.0.1
  poly_collisions: ^1.4.0
  in_app_purchase: ^3.1.13
  flutter_timezone: ^1.0.8
  flutter_animate: ^4.5.0
  google_mobile_ads: ^4.0.0
  new_version_plus: ^0.0.11
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  awesome_notifications: ^0.9.2
  simple_connection_checker: ^0.2.1
  loading_animation_widget: ^1.2.0+4

# Dependency overrides
dependency_overrides:
  js: ^0.7.1
  intl: ^0.19.0 # awesome_notifications & flutter_localizations
  web: ^0.5.0 # http & firebase_messaging

# Development dependencies
dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  
  # Lints
  flutter_lints: ^3.0.1
